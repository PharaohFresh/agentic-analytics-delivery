name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  demo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run verification harness (demo fixture)
        run: python scripts/run_audit.py --demo

      - name: Negative-path tests (seeded defects must fail the harness)
        run: python -m unittest discover -s tests -v
