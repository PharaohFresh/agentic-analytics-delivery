name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run verification harness (demo fixture)
        run: python scripts/run_audit.py --demo

      - name: Negative-path tests (seeded defects must fail the harness)
        run: python -m unittest discover -s tests -v

      - name: Lineage, approval, retry, recovery and integrity tests
        run: python -m pytest -q

      - name: Full synthetic delivery proof
        run: python -m delivery demo --output artifacts/ci-demo
